<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change this title</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #14161a;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .stage {
      height: 100%;
      box-sizing: border-box;
      padding: 1.5vmin;
    }
    .stage object,
    .stage iframe {
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 4px;
      background: #fff;
    }
    .fallback {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      color: #e6e8ec;
      text-align: center;
      padding: 2rem;
    }
    .fallback a {
      color: #14161a;
      background: #e6e8ec;
      padding: 0.7rem 1.2rem;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 600;
    }
    .fallback a:focus-visible {
      outline: 3px solid #7aa2f7;
      outline-offset: 3px;
    }
  </style>
</head>
<body>

  <div class="stage">
    <object data="document.pdf" type="application/pdf">
      <!-- Shown only if the browser can't display the PDF inline -->
      <div class="fallback">
        <p>Your browser can't show this PDF inline.</p>
        <a href="document.pdf">Open the PDF</a>
      </div>
    </object>
  </div>

</body>
</html>
